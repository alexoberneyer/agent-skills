<title>{{TITLE}}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300..500;1,6..72,300..500&display=swap">
<style>
/* Look inspired by the KyberCore Solutions site (kybercore.ai): dark ground,
   light serif display, mono labels, hairlines. Hue, type and motifs are our own. */
:root{
  /* ground and text: one tinted near-black, one warm off-white */
  --paper:#0b0c0f; --surface:#14161b;
  --ink:#ede9e0; --muted:#a3a097; --faint:#6f6d68;
  --line:#25272c; --line-strong:#3b3d43;
  /* the accent family: headlines in italic, numbers, the one thing that glows */
  --accent:#e9a25f; --accent-hi:#f6c995; --accent-lo:#8a6038; --accent-soft:#251d15;
  /* the second family: a cool counterweight for a second dimension */
  --alt:#86aecf; --alt-hi:#bcd4e8; --alt-lo:#3e5870; --alt-soft:#151c24;
  --flag:#ff5b45;
  --glow:rgba(233,162,95,.14); --glow-alt:rgba(134,174,207,.07);
  --display:'Newsreader',Georgia,'Times New Roman',serif;
  --body:'DM Sans',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}

/* Deliberately single-world: one dark palette for screen, projector and PDF,
   rather than following the viewer's theme. */

*{box-sizing:border-box}
body{
  margin:0; background:#000; color:var(--ink);
  font-family:var(--body); font-weight:400;
  display:flex; align-items:center; justify-content:center;
  min-height:100vh; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ---------- progress ---------- */
#progress{
  position:fixed; top:0; left:0; height:2px; background:var(--accent);
  width:0; z-index:50; transition:width .25s ease;
}

/* ---------- stage ---------- */
#deck{width:min(100vw,177.7778vh); aspect-ratio:16/9; position:relative}
.slide{
  position:absolute; inset:0; container-type:size;
  background:
    radial-gradient(55% 60% at 0% 0%,var(--glow-alt),transparent 70%),
    radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.35)),
    var(--paper);
  color:var(--ink); overflow:hidden;
  padding:5.2cqw 5.6cqw 4.4cqw;
  display:none; flex-direction:column;
}
.slide.on{display:flex}

/* stage variant: title and closing slides get the warm glow and corner marks */
.slide.dark{
  background:
    radial-gradient(60% 75% at 92% 105%,var(--glow),transparent 70%),
    radial-gradient(45% 55% at 8% -5%,var(--glow-alt),transparent 70%),
    radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.5)),
    var(--paper);
}
.slide.dark::after{
  content:""; position:absolute; inset:2.2cqw; pointer-events:none;
  --m:var(--line-strong); --l:1.4cqw;
  background:
    linear-gradient(var(--m),var(--m)) top left/var(--l) 1px no-repeat,
    linear-gradient(var(--m),var(--m)) top left/1px var(--l) no-repeat,
    linear-gradient(var(--m),var(--m)) top right/var(--l) 1px no-repeat,
    linear-gradient(var(--m),var(--m)) top right/1px var(--l) no-repeat,
    linear-gradient(var(--m),var(--m)) bottom left/var(--l) 1px no-repeat,
    linear-gradient(var(--m),var(--m)) bottom left/1px var(--l) no-repeat,
    linear-gradient(var(--m),var(--m)) bottom right/var(--l) 1px no-repeat,
    linear-gradient(var(--m),var(--m)) bottom right/1px var(--l) no-repeat;
}

/* ---------- type ---------- */
.eyebrow{
  font-family:var(--mono); font-size:.95cqw; font-weight:500;
  letter-spacing:.24em; text-transform:uppercase; color:var(--muted);
  margin:0 0 1.8cqw;
}
.eyebrow b{font-weight:500; color:var(--accent); margin-right:1.4em}
.meta{
  position:absolute; top:5.2cqw; right:5.6cqw; margin:0;
  font-family:var(--mono); font-size:.95cqw; font-weight:400;
  letter-spacing:.24em; text-transform:uppercase; color:var(--faint);
}
h1{
  font-family:var(--display); font-weight:300; font-size:8.8cqw;
  line-height:.94; letter-spacing:-.035em; margin:0; text-wrap:balance;
}
h2{
  font-family:var(--display); font-weight:400; font-size:4.8cqw;
  line-height:1.02; letter-spacing:-.025em; margin:0; text-wrap:balance;
}
h1 em,h2 em{font-style:italic; font-weight:inherit; color:var(--accent)}
.rule{width:5.6cqw; height:1px; background:var(--accent); margin:1.8cqw 0 2.2cqw; border:0}
.lede{font-size:1.85cqw; line-height:1.5; font-weight:300; color:var(--muted); max-width:52ch; margin:0}
.slide-body{flex:1; min-height:0; display:flex; flex-direction:column; justify-content:center}
.kicker{
  margin-top:auto; padding-top:1.8cqw; font-size:1.45cqw; line-height:1.45; color:var(--muted);
  border-top:1px solid var(--line);
}
.kicker strong{font-weight:500; color:var(--ink)}
code,.mono{font-family:var(--mono); font-size:.9em; font-weight:400}

/* ---------- title slide ---------- */
.title-slide{justify-content:center; padding-bottom:6.5cqw}
.title-slide > .eyebrow{position:absolute; top:5.2cqw; left:5.6cqw; margin:0}
.title-slide .lede{margin-top:2.6cqw}
.hero-facts{
  display:flex; gap:4cqw; margin:4cqw 0 0; padding-top:1.8cqw;
  border-top:1px solid var(--line);
}
.fact{display:flex; flex-direction:column; gap:.6cqw}
.fact dt{font-family:var(--mono); font-size:.85cqw; font-weight:500; letter-spacing:.22em; text-transform:uppercase; color:var(--faint)}
.fact dd{margin:0; font-size:1.45cqw; font-weight:400; color:var(--ink)}

/* ---------- generic lists ---------- */
.stack{display:flex; flex-direction:column; gap:1.5cqw; margin:0; padding:0; list-style:none}
.stack li{font-size:2cqw; line-height:1.4; font-weight:300}
.stack li strong{font-weight:500}
.stack.tight li{font-size:1.7cqw}

/* item rows: name + gloss */
.rows{display:flex; flex-direction:column; gap:0; margin:0; padding:0; list-style:none; border-top:1px solid var(--line)}
.rows li{display:grid; grid-template-columns:15.5cqw minmax(0,1fr); gap:1.6cqw; align-items:baseline; padding:1.05cqw 0; border-bottom:1px solid var(--line)}
.rows .nm{font-family:var(--mono); font-weight:500; font-size:1.3cqw; color:var(--accent); word-break:break-word}
.rows .gl{font-size:1.5cqw; line-height:1.42; font-weight:300; color:var(--ink)}

/* ---------- columns ---------- */
.cols{display:grid; gap:2.4cqw}
.c4{grid-template-columns:repeat(4,1fr)}
.c2{grid-template-columns:1fr 1fr; gap:3.2cqw}
.col-h{
  font-family:var(--display); font-weight:400; font-size:2.2cqw; letter-spacing:-.01em; margin:0 0 1cqw;
  padding-bottom:1cqw; border-bottom:1px solid var(--line-strong);
}
.col-p{margin:0; font-size:1.35cqw; line-height:1.5; font-weight:300; color:var(--muted)}
.col--accent .col-h{border-bottom-color:var(--accent)}

/* ---------- big numbers ---------- */
.stat b{
  display:block; font-family:var(--display); font-weight:300; font-size:6.4cqw;
  line-height:1; letter-spacing:-.04em; color:var(--ink); font-variant-numeric:lining-nums;
}
.stat b i{font-style:italic; color:var(--accent)}
.stat span{
  display:block; margin-top:1.2cqw; padding-top:1cqw; border-top:1px solid var(--line);
  font-family:var(--mono); font-size:.9cqw; letter-spacing:.2em; text-transform:uppercase; color:var(--muted);
}

/* ---------- group cards ---------- */
.groups{display:grid; grid-template-columns:repeat(4,1fr); gap:1.6cqw}
.group{background:rgba(255,255,255,.015); border:1px solid var(--line); padding:1.5cqw 1.4cqw}
.group h3{
  font-family:var(--mono); font-size:.9cqw; font-weight:500; letter-spacing:.2em;
  text-transform:uppercase; color:var(--accent); margin:0 0 1.2cqw;
}
.group ul{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:.9cqw}
.group li{font-weight:500; font-size:1.25cqw; line-height:1.3; color:var(--ink)}
.group li span{display:block; font-weight:300; font-size:1.05cqw; color:var(--muted); margin-top:.25cqw}

/* ---------- tables ---------- */
table{width:100%; border-collapse:collapse; font-size:1.45cqw}
th{
  font-family:var(--mono); color:var(--muted); font-size:.85cqw; font-weight:500;
  letter-spacing:.2em; text-transform:uppercase; text-align:left;
  padding:.9cqw 1.2cqw; border-bottom:1px solid var(--accent);
}
td{padding:1cqw 1.2cqw; border-bottom:1px solid var(--line); vertical-align:top; line-height:1.35; font-weight:300}
tr:last-child td{border-bottom:0}
td .mono{color:var(--accent); font-weight:500}
tr.hi td{background:var(--accent-soft)}

/* ---------- chart ---------- */
.chart{display:flex; flex-direction:column; gap:1cqw}
.bar-row{display:grid; grid-template-columns:13cqw minmax(0,1fr) 5cqw; gap:1.2cqw; align-items:center}
.bar-lab{font-family:var(--mono); font-size:1.05cqw; font-weight:500; letter-spacing:.06em; color:var(--muted); text-align:right}
.bar-track{height:1.5cqw; background:var(--surface); border-left:1px solid var(--line-strong)}
.bar-fill{height:100%; background:var(--alt-lo)}
.bar-row.lead .bar-fill{background:var(--accent)}
.bar-row.lead .bar-lab{color:var(--ink)}
.bar-val{
  font-family:var(--mono); font-size:1.2cqw; font-weight:500; color:var(--muted);
  font-variant-numeric:tabular-nums;
}
.bar-row.lead .bar-val{color:var(--accent)}

/* ---------- chrome ---------- */
#chrome{
  position:fixed; right:2.2vh; bottom:1.8vh; z-index:40;
  display:flex; align-items:center; gap:1.4vh;
  font-family:var(--mono); font-size:1.4vh; letter-spacing:.12em; text-transform:uppercase;
  color:var(--muted); background:rgba(11,12,15,.82); padding:.7vh 1.1vh;
  border:1px solid var(--line);
}
#counter{font-variant-numeric:tabular-nums}
#chrome button{
  font:inherit; color:inherit; background:none;
  border:1px solid var(--line-strong);
  width:3.4vh; height:3.4vh; cursor:pointer; line-height:1;
}
#chrome button:hover{color:var(--ink); border-color:var(--accent)}
#chrome button:focus-visible,#printbtn:focus-visible{outline:1px solid var(--accent); outline-offset:2px}
#chrome #printbtn{
  width:auto; height:auto; font:inherit; color:inherit; background:none; border:0; cursor:pointer; padding:0;
  text-decoration:underline; text-underline-offset:.35vh; text-decoration-color:var(--line-strong);
}
#hint{
  position:fixed; left:2.2vh; bottom:1.8vh; z-index:40;
  font-family:var(--mono); font-size:1.3vh; letter-spacing:.12em; text-transform:uppercase;
  color:var(--faint); background:rgba(11,12,15,.7); padding:.6vh 1vh;
  border:1px solid var(--line);
}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- print: one slide per landscape page ---------- */
@media print{
  @page{size:landscape; margin:0}
  body{display:block; background:var(--paper); overflow:visible}
  #progress,#chrome,#hint{display:none!important}
  #deck{width:100%; aspect-ratio:auto}
  .slide{
    display:flex!important; position:relative; inset:auto;
    width:100%; height:100vh; break-after:page;
    print-color-adjust:exact; -webkit-print-color-adjust:exact;
  }
  .slide:last-child{break-after:auto}
}

/* ---------- split layout: text left, one visual right ---------- */
.split{flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,40fr) minmax(0,60fr); gap:4.5cqw}
.copy{display:flex; flex-direction:column; justify-content:center; min-width:0}
.copy h2{font-size:4.2cqw}
.copy .rule{margin:1.5cqw 0 1.8cqw}
.copy .lede{font-size:1.65cqw; line-height:1.5; max-width:none}
.viz{display:flex; align-items:center; justify-content:center; min-width:0; min-height:0}
.viz svg{display:block; width:100%; height:auto; max-height:45cqw}
.viz svg text{font-family:var(--body)}
.viz svg text.display{font-family:var(--display)}
.viz svg text.mono{font-family:var(--mono); letter-spacing:.16em; text-transform:uppercase}

/* ---------- labelled rows: swatch, number or big numeral, then label and gloss ---------- */
.items{list-style:none; margin:2cqw 0 0; padding:0; display:flex; flex-direction:column; gap:1.5cqw}
.items li{display:grid; grid-template-columns:2.6cqw minmax(0,1fr); gap:1.2cqw; align-items:start}
.items .sw{width:1.1cqw; height:1.1cqw; margin-top:.45cqw}
.items .num{
  font-family:var(--mono); font-weight:500; font-size:1.05cqw; letter-spacing:.08em;
  color:var(--accent); padding-top:.45cqw;
}
.items .big{font-family:var(--display); font-weight:300; font-size:2.8cqw; line-height:1; color:var(--accent)}
.items .t b{display:block; font-weight:500; font-size:1.55cqw; line-height:1.3; color:var(--ink)}
.items .t span{display:block; font-size:1.38cqw; line-height:1.45; font-weight:300; color:var(--muted); margin-top:.2cqw}
.items.qs .t b{font-family:var(--display); font-weight:400; font-size:2.2cqw; line-height:1.2}
.note{margin:2.4cqw 0 0; padding-top:1.5cqw; border-top:1px solid var(--line); font-size:1.45cqw; line-height:1.45; font-weight:300; color:var(--muted)}
.note strong{font-weight:500; color:var(--ink)}

/* ---------- proposal marker: an invented number never reads as a finding ---------- */
.badge{
  display:inline-block; font-family:var(--mono); font-size:.75cqw; font-weight:500;
  letter-spacing:.2em; text-transform:uppercase; color:var(--accent);
  border:1px solid var(--accent-lo); padding:.25cqw .6cqw; margin-left:.8cqw; vertical-align:.25cqw;
}

/* ---------- title slide with a quiet SVG motif behind the words ---------- */
.title-motif{position:absolute; right:4cqw; top:50%; transform:translateY(-50%); width:40cqw; height:auto; pointer-events:none}
.title-slide.with-motif > h1,
.title-slide.with-motif > .lede,
.title-slide.with-motif > .hero-facts{position:relative; max-width:54%}
</style>

<div id="progress"></div>

<div id="deck">
<!-- deck:body:start -->
{{BODY}}
<!-- deck:body:end -->
</div>

<div id="hint">Arrow keys or click to advance</div>
<div id="chrome">
  <span id="counter"></span>
  <button id="prev" type="button" aria-label="Previous slide">&larr;</button>
  <button id="next" type="button" aria-label="Next slide">&rarr;</button>
  <button id="printbtn" type="button">Print</button>
</div>

<script>
(function(){
  var slides = Array.prototype.slice.call(document.querySelectorAll('.slide'));
  var i = 0;
  var counter = document.getElementById('counter');
  var progress = document.getElementById('progress');

  function show(n){
    i = Math.max(0, Math.min(slides.length - 1, n));
    slides.forEach(function(s, k){ s.classList.toggle('on', k === i); });
    counter.textContent = (i + 1) + ' / ' + slides.length;
    progress.style.width = ((i + 1) / slides.length * 100) + '%';
    try { location.hash = i ? 's' + (i + 1) : ''; } catch (e) {}
  }

  document.addEventListener('keydown', function(e){
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { show(i + 1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { show(i - 1); e.preventDefault(); }
    else if (e.key === 'Home') { show(0); e.preventDefault(); }
    else if (e.key === 'End') { show(slides.length - 1); e.preventDefault(); }
  });

  document.getElementById('next').addEventListener('click', function(e){ e.stopPropagation(); show(i + 1); });
  document.getElementById('prev').addEventListener('click', function(e){ e.stopPropagation(); show(i - 1); });
  document.getElementById('printbtn').addEventListener('click', function(e){ e.stopPropagation(); window.print(); });

  document.getElementById('deck').addEventListener('click', function(e){
    var r = this.getBoundingClientRect();
    show(e.clientX - r.left < r.width * 0.28 ? i - 1 : i + 1);
  });

  var m = (location.hash || '').match(/^#s(\d+)$/);
  show(m ? parseInt(m[1], 10) - 1 : 0);
})();
</script>
