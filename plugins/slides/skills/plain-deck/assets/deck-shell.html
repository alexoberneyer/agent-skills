<title>{{TITLE}}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --accent:#2e5e8c; --accent-60:#254c72; --accent-70:#1b3a58; --accent-80:#0f2438;
  --accent-10:#d5dee6; --accent-soft:#eef3f7;
  --alt:#4f9a8a; --alt-70:#3a7367; --alt-soft:#e6efec;
  --alt-20:#bfdcd5; --alt-05:#f2f8f6;
  --flag:#c8372d; --warm:#e08a5f; --warm-soft:#f8e8df;
  --ink:#16191d; --muted:#5f6b76; --line:#e3e8ec;
  --paper:#ffffff; --surface:#f7f9fa;
  --display:'Inter',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}

/* Deliberately single-world: this deck is projected and printed, so it commits
   to one light palette rather than following the viewer's theme. */

*{box-sizing:border-box}
body{
  margin:0; background:var(--accent-80); color:var(--ink);
  font-family:var(--body); font-weight:300;
  display:flex; align-items:center; justify-content:center;
  min-height:100vh; overflow:hidden;
}

/* ---------- progress ---------- */
#progress{
  position:fixed; top:0; left:0; height:4px; background:var(--flag);
  width:0; z-index:50; transition:width .25s ease;
}

/* ---------- stage ---------- */
#deck{width:min(100vw,177.7778vh); aspect-ratio:16/9; position:relative}
.slide{
  position:absolute; inset:0; container-type:size;
  background:var(--paper); overflow:hidden;
  padding:5.2cqw 5.6cqw 4.4cqw;
  display:none; flex-direction:column;
}
.slide.on{display:flex}

/* dark variant */
.slide.dark{
  background:linear-gradient(135deg,var(--accent-70) 0%,var(--accent) 62%,var(--alt-70) 100%);
  color:#fff;
}
.slide.dark .eyebrow{color:var(--alt-20)}
.slide.dark .lede{color:rgba(255,255,255,.86)}
.slide.dark .rule{background:var(--alt-20)}

/* ---------- type ---------- */
.eyebrow{
  font-family:var(--body); font-size:1.05cqw; font-weight:700;
  letter-spacing:.2em; text-transform:uppercase; color:var(--alt-70);
  margin:0 0 1.6cqw;
}
h1{
  font-family:var(--display); font-weight:800; font-size:8.4cqw;
  line-height:1.02; letter-spacing:-.025em; margin:0; text-wrap:balance;
}
h2{
  font-family:var(--display); font-weight:800; font-size:5cqw;
  line-height:1.06; letter-spacing:-.022em; margin:0; text-wrap:balance;
}
.rule{width:5.6cqw; height:.38cqw; background:var(--flag); margin:1.5cqw 0 2.4cqw; border:0}
.lede{font-size:1.95cqw; line-height:1.5; color:var(--muted); max-width:52ch; margin:0}
.slide-body{flex:1; min-height:0; display:flex; flex-direction:column; justify-content:center}
.kicker{
  margin-top:auto; padding-top:2cqw; font-size:1.55cqw; line-height:1.45;
  border-top:1px solid var(--line);
}
.slide.dark .kicker{border-top-color:rgba(255,255,255,.22)}
.kicker strong{font-weight:700}
code,.mono{font-family:var(--mono); font-size:.92em; font-weight:400}

/* ---------- title slide ---------- */
.title-slide{justify-content:center; padding-bottom:6.5cqw}
.hero-facts{
  display:flex; gap:3cqw; margin-top:4cqw; padding-top:2.2cqw;
  border-top:1px solid rgba(255,255,255,.24);
}
.fact{display:flex; flex-direction:column; gap:.5cqw}
.fact dt{font-size:.95cqw; font-weight:700; letter-spacing:.18em; text-transform:uppercase; color:var(--alt-20)}
.fact dd{margin:0; font-size:1.5cqw; font-weight:500; color:#fff}
.accent-bar{
  position:absolute; left:0; right:0; bottom:0; height:.85cqw;
  background:linear-gradient(90deg,var(--accent) 0 60%,var(--alt) 60% 82%,var(--alt-20) 82% 95%,var(--flag) 95% 100%);
}
/* the accent family is the dark slide's own ground, so lift the bar off it */
.slide.dark .accent-bar{
  background:linear-gradient(90deg,var(--accent-10) 0 60%,var(--alt-20) 60% 82%,var(--alt) 82% 95%,var(--flag) 95% 100%);
}

/* ---------- generic lists ---------- */
.stack{display:flex; flex-direction:column; gap:1.5cqw; margin:0; padding:0; list-style:none}
.stack li{font-size:2.1cqw; line-height:1.4; font-weight:300}
.stack li strong{font-weight:700}
.stack.tight li{font-size:1.75cqw}

/* item rows: name + gloss */
.rows{display:flex; flex-direction:column; gap:1.15cqw; margin:0; padding:0; list-style:none}
.rows li{display:grid; grid-template-columns:15.5cqw minmax(0,1fr); gap:1.6cqw; align-items:baseline}
.rows .nm{font-family:var(--mono); font-weight:600; font-size:1.42cqw; color:var(--accent); word-break:break-word}
.slide.dark .rows .nm{color:var(--alt-20)}
.rows .gl{font-size:1.5cqw; line-height:1.42; color:var(--ink)}
.slide.dark .rows .gl{color:rgba(255,255,255,.9)}

/* ---------- columns ---------- */
.cols{display:grid; gap:2cqw}
.c4{grid-template-columns:repeat(4,1fr)}
.c2{grid-template-columns:1fr 1fr; gap:3.2cqw}
.col-h{
  font-family:var(--body); font-weight:700; font-size:1.6cqw; margin:0 0 .8cqw;
  padding-bottom:.7cqw; border-bottom:.22cqw solid var(--alt);
}
.col-p{margin:0; font-size:1.35cqw; line-height:1.45; color:var(--muted)}
.col--accent .col-h{border-bottom-color:var(--flag)}

/* ---------- group cards ---------- */
.groups{display:grid; grid-template-columns:repeat(4,1fr); gap:1.6cqw}
.group{background:var(--surface); border:1px solid var(--line); border-radius:.8cqw; padding:1.5cqw 1.4cqw}
.group h3{
  font-family:var(--body); font-size:1.02cqw; font-weight:700; letter-spacing:.14em;
  text-transform:uppercase; color:var(--alt-70); margin:0 0 1cqw;
}
.group ul{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:.85cqw}
.group li{font-family:var(--mono); font-weight:600; font-size:1.16cqw; line-height:1.3; color:var(--accent)}
.group li span{display:block; font-family:var(--body); font-weight:300; font-size:1.02cqw; color:var(--muted); margin-top:.25cqw}

/* ---------- tables ---------- */
table{width:100%; border-collapse:collapse; font-size:1.5cqw}
th{
  background:var(--accent-70); color:#fff; font-size:.95cqw; font-weight:700;
  letter-spacing:.1em; text-transform:uppercase; text-align:left;
  padding:.9cqw 1.2cqw;
}
td{padding:1cqw 1.2cqw; border-bottom:1px solid var(--line); vertical-align:top; line-height:1.35}
tr:last-child td{border-bottom:0}
.slide.dark td{border-bottom-color:rgba(255,255,255,.18); color:#fff}
td .mono{color:var(--accent); font-weight:600}
.slide.dark td .mono{color:var(--alt-20)}
tr.hi td{background:var(--warm-soft)}
tr.hi td .mono{color:var(--accent-70)}

/* ---------- chart ---------- */
.chart{display:flex; flex-direction:column; gap:.95cqw}
.bar-row{display:grid; grid-template-columns:13cqw minmax(0,1fr) 4cqw; gap:1.2cqw; align-items:center}
.bar-lab{font-family:var(--mono); font-size:1.2cqw; font-weight:600; color:var(--accent); text-align:right}
.bar-track{height:1.9cqw; background:var(--accent-soft); border-radius:.2cqw; overflow:hidden}
.bar-fill{height:100%; background:var(--alt); border-radius:.2cqw}
.bar-row.lead .bar-fill{background:var(--accent)}
.bar-val{
  font-family:var(--mono); font-size:1.25cqw; font-weight:600; color:var(--ink);
  font-variant-numeric:tabular-nums;
}
.bar-row.lead .bar-val{color:var(--flag)}

/* ---------- chrome ---------- */
#chrome{
  position:fixed; right:2.2vh; bottom:1.8vh; z-index:40;
  display:flex; align-items:center; gap:1.4vh;
  font-family:var(--body); font-size:1.65vh; color:rgba(255,255,255,.88);
  /* its own ground: white-on-white otherwise once a light slide fills an exact 16:9 viewport */
  background:rgba(15,36,56,.78); padding:.7vh 1.1vh; border-radius:.7vh;
}
#counter{font-variant-numeric:tabular-nums; letter-spacing:.06em}
#chrome button{
  font:inherit; color:inherit; background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.22); border-radius:.5vh;
  width:3.4vh; height:3.4vh; cursor:pointer; line-height:1;
}
#chrome button:hover{background:rgba(255,255,255,.24)}
#chrome button:focus-visible,#printbtn:focus-visible{outline:2px solid var(--alt-20); outline-offset:2px}
#printbtn{
  font:inherit; color:inherit; background:none; border:0; cursor:pointer;
  text-decoration:underline; text-underline-offset:.35vh; padding:0;
}
#hint{
  position:fixed; left:2.2vh; bottom:1.8vh; z-index:40;
  font-family:var(--body); font-size:1.5vh; color:rgba(255,255,255,.8);
  background:rgba(15,36,56,.62); padding:.5vh 1vh; border-radius:.6vh;
}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- print: one slide per landscape page ---------- */
@media print{
  @page{size:landscape; margin:0}
  body{display:block; background:#fff; overflow:visible}
  #progress,#chrome,#hint{display:none!important}
  #deck{width:100%; aspect-ratio:auto}
  .slide{
    display:flex!important; position:relative; inset:auto;
    width:100%; height:100vh; break-after:page;
    print-color-adjust:exact; -webkit-print-color-adjust:exact;
  }
  .slide:last-child{break-after:auto}
}

/* ---------- split layout: text left, one visual right ---------- */
.split{flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,40fr) minmax(0,60fr); gap:4.5cqw}
.copy{display:flex; flex-direction:column; justify-content:center; min-width:0}
.copy h2{font-size:4.3cqw}
.copy .rule{margin:1.3cqw 0 1.8cqw}
.copy .lede{font-size:1.7cqw; line-height:1.45; max-width:none}
.viz{display:flex; align-items:center; justify-content:center; min-width:0; min-height:0}
.viz svg{display:block; width:100%; height:auto; max-height:45cqw}
.viz svg text{font-family:var(--body)}
.viz svg text.display{font-family:var(--display)}

/* ---------- labelled rows: swatch, flagged number or big numeral, then label and gloss ---------- */
.items{list-style:none; margin:2cqw 0 0; padding:0; display:flex; flex-direction:column; gap:1.6cqw}
.items li{display:grid; grid-template-columns:2.2cqw minmax(0,1fr); gap:1.2cqw; align-items:start}
.items .sw{width:2.2cqw; height:2.2cqw; border-radius:.5cqw; margin-top:.1cqw}
.items .num{
  width:2.2cqw; height:2.2cqw; border-radius:50%; background:var(--flag); color:#fff;
  font-weight:700; font-size:1.2cqw; display:flex; align-items:center; justify-content:center;
}
.items .big{font-family:var(--display); font-weight:800; font-size:2.6cqw; line-height:1; color:var(--alt-70)}
.items .t b{display:block; font-weight:700; font-size:1.6cqw; line-height:1.3; color:var(--ink)}
.items .t span{display:block; font-size:1.42cqw; line-height:1.45; color:var(--muted); margin-top:.2cqw}
.items.qs .t b{font-size:2.2cqw; line-height:1.25}
.note{margin:2.4cqw 0 0; padding-top:1.5cqw; border-top:1px solid var(--line); font-size:1.55cqw; line-height:1.45}
.note strong{font-weight:700}

/* ---------- proposal marker: an invented number never reads as a finding ---------- */
.badge{
  display:inline-block; font-family:var(--body); font-size:.82cqw; font-weight:700;
  letter-spacing:.14em; text-transform:uppercase; color:#fff; background:var(--warm);
  border-radius:.3cqw; padding:.28cqw .7cqw; margin-left:.8cqw; vertical-align:.22cqw;
}
.slide.dark .badge{background:var(--alt-20); color:var(--accent-80)}

/* ---------- title slide with a quiet SVG motif behind the words ---------- */
.title-motif{position:absolute; right:4cqw; top:50%; transform:translateY(-50%); width:40cqw; height:auto; pointer-events:none}
.title-slide.with-motif > .eyebrow,
.title-slide.with-motif > h1,
.title-slide.with-motif > .lede,
.title-slide.with-motif > .hero-facts{position:relative; max-width:54%}
</style>

<div id="progress"></div>

<div id="deck">
<!-- deck:body:start -->
{{BODY}}
<!-- deck:body:end -->
</div>

<div id="hint">Arrow keys or click to advance</div>
<div id="chrome">
  <span id="counter"></span>
  <button id="prev" type="button" aria-label="Previous slide">&larr;</button>
  <button id="next" type="button" aria-label="Next slide">&rarr;</button>
  <button id="printbtn" type="button">Print</button>
</div>

<script>
(function(){
  var slides = Array.prototype.slice.call(document.querySelectorAll('.slide'));
  var i = 0;
  var counter = document.getElementById('counter');
  var progress = document.getElementById('progress');

  function show(n){
    i = Math.max(0, Math.min(slides.length - 1, n));
    slides.forEach(function(s, k){ s.classList.toggle('on', k === i); });
    counter.textContent = (i + 1) + ' / ' + slides.length;
    progress.style.width = ((i + 1) / slides.length * 100) + '%';
    try { location.hash = i ? 's' + (i + 1) : ''; } catch (e) {}
  }

  document.addEventListener('keydown', function(e){
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { show(i + 1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { show(i - 1); e.preventDefault(); }
    else if (e.key === 'Home') { show(0); e.preventDefault(); }
    else if (e.key === 'End') { show(slides.length - 1); e.preventDefault(); }
  });

  document.getElementById('next').addEventListener('click', function(e){ e.stopPropagation(); show(i + 1); });
  document.getElementById('prev').addEventListener('click', function(e){ e.stopPropagation(); show(i - 1); });
  document.getElementById('printbtn').addEventListener('click', function(e){ e.stopPropagation(); window.print(); });

  document.getElementById('deck').addEventListener('click', function(e){
    var r = this.getBoundingClientRect();
    show(e.clientX - r.left < r.width * 0.28 ? i - 1 : i + 1);
  });

  var m = (location.hash || '').match(/^#s(\d+)$/);
  show(m ? parseInt(m[1], 10) - 1 : 0);
})();
</script>
